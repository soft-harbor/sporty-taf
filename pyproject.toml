[project]
name = "sporty-taf"
version = "0.1.0"
description = "QA Automation Framework for Sporty Group"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "pyyaml>=6.0.3",
    "selenium>=4.46.0",
    "pytest>=9.1.1",
    "pytest-check>=2.8.0",
    "allure-pytest>=2.13.5",
    "allure-python-commons>=2.16.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.21",
    "pre-commit==4.6.0",
    "pyright[nodejs]==1.1.411",
]
contract = [
    "schemathesis>=4.22.4",
]

[tool.uv]
package = false


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "PLR", # pylint refactor
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports (includes TID252 absolute-imports, also enforced by ban-relative-imports)
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "T20", # flake8-print
    "FURB",
    "FLY"
]

ignore = [
    "E501", # line too long, handled by ruff format
    "W191", # tab indentation, handled by ruff format
    "E111", # indentation with invalid multiple, handled by ruff format
    "E114", # indentation with invalid multiple comment, handled by ruff format
    "E117", # over-indented, handled by ruff format
]

exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".idea",
    ".vscode",
    "*.egg-info",
    "python_out",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values (prices, status codes) are acceptable in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = [
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
markers = [
    "ui: end-to-end UI tests using Selenium",
    "api: API/integration tests",
]
